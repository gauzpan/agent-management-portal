document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ar(--font-display);font-weight:460;font-size:56px;line-height:0.98;letter-spacing:-1.32px;margin-bottom:24px;\">A single home for every education agent partnership.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#d7ecdd;max-width:440px;\">Onboard lawfully, monitor performance, share the right collateral, and stay compliant with ESOS and ASQA — from one workspace.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;font-size:12px;color:#bcd4c4;\">\n        <div>ESOS Act aligned<\u002Fdiv><div>ASQA standards<\u002Fdiv><div>PRISMS · ASQAnet ready<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fafaf8;display:flex;align-items:center;justify-content:center;padding:40px;\">\n      <div style=\"width:100%;max-width:400px;\">\n        <div style=\"font-family:var(--font-display);font-weight:540;font-size:28px;letter-spacing:-0.7px;color:#292827;margin-bottom:8px;\">Sign in<\u002Fdiv>\n        <div style=\"color:#73706d;font-size:14px;margin-bottom:32px;\">Use your college workspace credentials.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <label style=\"font-size:12px;font-weight:600;color:#292827;letter-spacing:0.2px;\">\n            Work email\n            <input value=\"{{ loginEmail }}\" sc-camel-on-input=\"{{ setLoginEmail }}\" placeholder=\"admin@college.edu.au\" style=\"width:100%;margin-top:6px;padding:12px 14px;border:1px solid #e8e4dd;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;outline:none;\">\n          <\u002Flabel>\n          <label style=\"font-size:12px;font-weight:600;color:#292827;letter-spacing:0.2px;\">\n            Password\n            <input type=\"password\" placeholder=\"••••••••••\" style=\"width:100%;margin-top:6px;padding:12px 14px;border:1px solid #e8e4dd;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;outline:none;\">\n          <\u002Flabel>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:13px;\">\n            <label style=\"display:flex;align-items:center;gap:6px;color:#73706d;\"><input type=\"checkbox\"> Keep me signed in<\u002Flabel>\n            <a href=\"#\" style=\"text-decoration:underline;\">Forgot password?<\u002Fa>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ doLogin }}\" style=\"margin-top:8px;padding:14px 20px;background:#292827;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:540;cursor:pointer;font-family:inherit;\">Continue<\u002Fbutton>\n          <div style=\"text-align:center;font-size:12px;color:#9a9794;margin-top:8px;\">or<\u002Fdiv>\n          <button style=\"padding:12px 20px;background:#fff;color:#292827;border:1px solid #e8e4dd;border-radius:8px;font-size:14px;font-weight:540;cursor:pointer;font-family:inherit;\">Continue with SSO<\u002Fbutton>\n          <div style=\"text-align:center;font-size:12px;color:#9a9794;margin-top:24px;\">Are you an agent? <a href=\"#\" style=\"text-decoration:underline;\">Sign in to the Agent Portal<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:232px 1fr;min-height:100vh;\">\n  <aside style=\"background:#00843d;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;\">\n    <div style=\"display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:540;font-size:17px;padding:8px 10px 24px;\">\n      <div style=\"width:26px;height:26px;border-radius:6px;background:#ffcd00;display:flex;align-items:center;justify-content:center;color:#00247d;font-weight:700;font-size:14px;\">A<\u002Fdiv>\n      <div style=\"line-height:1.15;\">\n        <div>AMP<\u002Fdiv>\n        <div style=\"font-size:10px;color:#bcd4c4;font-weight:460;letter-spacing:0.4px;\">Kensington M n<\u002Fdiv>\n      <label style=\"display:block;font-size:12px;font-weight:600;margin-bottom:6px;\">Reason<\u002Flabel>\n      <sc-raw-select style=\"width:100%;padding:11px 14px;border:1px solid #e8e4dd;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;margin-bottom:14px;\">\n        <option>Incomplete business registration<\u002Foption><option>Failed reference checks<\u002Foption><option>Regulatory non-compliance<\u002Foption><option>Duplicate application<\u002Foption>\n      <\u002Fsc-raw-select>\n      <label style=\"display:block;font-size:12px;font-weight:600;margin-bottom:6px;\">Comments to agent<\u002Flabel>\n      <textarea rows=\"4\" placeholder=\"These comments will be included in the rejection email.\" style=\"width:100%;padding:11px 14px;border:1px solid #e8e4dd;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;resize:vertical;margin-bottom:20px;\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end;\">\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding:10px 16px;background:#fff;color:#292827;border:1px solid #e8e4dd;border-radius:8px;font-size:13px;font-weight:540;cursor:pointer;\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmReject }}\" style=\"padding:10px 18px;background:#a12020;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;\">Send rejection<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ modalRequestInfo }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(41,40,39,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;\" sc-camel-on-click=\"{{ closeModal }}\">\n    <div style=\"background:#fff;border-radius:16px;padding:32px;max-width:520px;width:100%;box-shadow:var(--shadow-2);\">\n      <div style=\"font-family:var(--font-display);font-weight:540;font-size:22px;letter-spacing:-0.4px;margin-bottom:8px;\">Request more information<\u002Fdiv>\n      <div style=\"font-size:13px;color:#73706d;margin-bottom:20px;\">Status will change to <b style=\"color:#8a4b00;\">Pending Agent Response<\u002Fb>. The agent receives an email with the checked items.<\u002Fdiv>\n      <sc-for list=\"{{ requestItems }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <label style=\"display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #f3f0eb;font-size:13px;cursor:pointer;\">\n          <input type=\"checkbox\" checked=\"{{ r.checked }}\" style=\"margin-top:2px;\">\n          <div>\n            <div style=\"font-weight:540;\">{{ r.title }}<\u002Fdiv>\n            <div style=\"color:#73706d;font-size:12px;\">{{ r.detail }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Flabel>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:20px;\">\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding:10px 16px;background:#fff;color:#292827;border:1px solid #e8e4dd;border-radius:8px;font-size:13px;font-weight:540;cursor:pointer;\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmRequestInfo }}\" style=\"padding:10px 18px;background:#292827;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;\">Send request<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:24px;right:24px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:12px;\">\n    <sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:360px;height:480px;background:#fff;border:1px solid #e8e4dd;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,0.15);display:flex;flex-direction:column;overflow:hidden;\">\n        <div style=\"padding:14px 16px;background:radial-gradient(120% 100% at 90% 10%, #1a9c55 0%, #00843d 60%, #004d24 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;font-size:16px;\">✦<\u002Fdiv>\n            <div>\n              <div style=\"font-family:var(--font-display);font-weight:540;font-size:14px;\">Ask AMP<\u002Fdiv>\n              <div style=\"font-size:11px;color:#bcd4c4;display:flex;align-items:center;gap:5px;\"><span style=\"width:6px;height:6px;border-radius:999px;background:#ffcd00;animation:pulse-dot 2s infinite;\"><\u002Fspan>AI copilot · online<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ toggleChat }}\" style=\"width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;\">×<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"max-width:80%;padding:10px 14px;background:#fafaf8;border-radius:12px 12px 12px 4px;font-size:13px;line-height:1.5;color:#292827;\">Hi Priya — I can summarise applications, draft agent emails, run compliance checks or pull a report. What do you need?<\u002Fdiv>\n          <div style=\"align-self:flex-end;max-width:80%;padding:10px 14px;background:#00843d;color:#fff;border-radius:12px 12px 4px 12px;font-size:13px;line-height:1.5;\">Which active agents are trending toward the At risk band this quarter?<\u002Fdiv>\n          <div style=\"max-width:85%;padding:10px 14px;background:#fafaf8;border-radius:12px 12px 12px 4px;font-size:13px;line-height:1.55;color:#292827;\">3 agents shifted from Watch → At risk in the last 30 days: <b>Southern Cross Study<\u002Fb> (QEAC expiring, conv 58%), <b>Reef &amp; Ridge Global<\u002Fb> (comp 48%, suspended) and <b>Meridian Overseas<\u002Fb> (2 visa refusals). Want me to draft a check-in email for each?<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n            <div style=\"padding:6px 10px;background:#fff;border:1px solid #e8e4dd;border-radius:999px;font-size:11px;color:#292827;cursor:pointer;\">Draft emails<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#fff;border:1px solid #e8e4dd;border-radius:999px;font-size:11px;color:#292827;cursor:pointer;\">Show on dashboard<\u002Fdiv>\n            <div style=\"padding:6px 10px;background:#fff;border:1px solid #e8e4dd;border-radius:999px;font-size:11px;color:#292827;cursor:pointer;\">Export as PDF<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px;border-top:1px solid #e8e4dd;display:flex;gap:8px;align-items:center;background:#fff;\">\n          <input placeholder=\"Ask about agents, applications, compliance…\" style=\"flex:1;padding:9px 12px;border:1px solid #e8e4dd;border-radius:8px;font-size:13px;font-family:inherit;background:#fafaf8;outline:none;\">\n          <button style=\"width:36px;height:36px;background:#292827;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;\">→<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div sc-camel-on-click=\"{{ toggleChat }}\" style=\"width:56px;height:56px;border-radius:999px;background:radial-gradient(120% 100% at 30% 20%, #1a9c55 0%, #00843d 60%, #004d24 100%);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,132,61,0.35);position:relative;\">\n      <div style=\"font-size:22px;line-height:1;\">✦<\u002Fdiv>\n      <span style=\"position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:999px;background:#ffcd00;border:2px solid #fff;\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#292827;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.2);\">{{ toastMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    route: 'login',\n    agentTab: 'active',\n    docIdx: 0,\n    modal: null,\n    toast: null,\n    loginEmail: 'priya.ramesh@melbourneinstitute.edu.au',\n    appFilter: 'all',\n    chatOpen: false,\n    appTab: 'biz',\n  };\n\n  go(route) { this.setState({ route, modal: null }); window.scrollTo(0,0); }\n\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 2600);\n  }\n\n  status(name) {\n    const map = {\n      'New': ['#dbe6ff', '#00247d'],\n      'In Review': ['#fff4d4', '#8a6b00'],\n      'Pending Documents': ['#ffe4c4', '#8a4b00'],\n      'Pending Agent Response': ['#ede1ff', '#5c2ba0'],\n      'Approved': ['#e0f4e8', '#00843d'],\n      'Agreement Signed': ['#dbe6ff', '#00247d'],\n      'Rejected': ['#fbe4e4', '#a12020'],\n      'Active': ['#e0f4e8', '#00843d'],\n      'Suspended': ['#fbe4e4', '#a12020'],\n      'Expiring Soon': ['#fff4d4', '#8a6b00'],\n      'Terminated': ['#eeece9', '#73706d'],\n      'Draft': ['#eeece9', '#73706d'],\n    };\n    return map[name] || map['Draft'];\n  }\n\n  navItem(label, route, badge, badgeColor) {\n    const active = this.state.route === route || (route === 'agents' && ['agent','offboard'].includes(this.state.route));\n    return {\n      label, badge: badge || '',\n      bg: active ? 'rgba(255,255,255,0.14)' : 'transparent',\n      color: active ? '#fff' : '#bcd4c4',\n      badgeBg: badge ? (badgeColor || '#ffcd00') : 'transparent',\n      badgeColor: badge ? '#00247d' : 'transparent',\n      go: () => this.go(route),\n    };\n  }\n\n  renderVals() {\n    const r = this.state.route;\n    const isApp = r !== 'login';\n    const pageMeta = {\n      dashboard: ['', 'Melbourne Institute of Higher Education · 28 active partners'],\n      applications: ['Applications', '12 pending your review · sorted by oldest first'],\n      application: ['Reviewing application', 'App-2087 · Sunrise Overseas Consultants'],\n      agents: ['Agent directory', 'Track partnership status, performance and compliance'],\n      agent: ['Agent profile', 'Global Bridge Education · Vietnam'],\n      invite: ['Send portal invitation', 'Sunrise Overseas Consultants · India'],\n      marketing: ['Marketing collateral', 'The single source of truth shared with every agent'],\n      offboard: ['Terminate agent', 'Global Bridge Education · Vietnam'],\n      'agent-view': ['Agent portal', 'Sunrise Overseas Consultants · Partner view'],\n      invoices: ['Invoices &amp; commissions', 'Kensington Melbourne College · Agent billing ledger'],\n      agreement: ['Send agent agreement', 'Sunrise Overseas Consultants · Step 2 of 3 · Approval → Agreement → Invite'],\n      reports: ['Reports', 'Generate exec-ready reports on agent activity, performance and compliance'],\n      audit: ['Audit trail', 'Immutable, timestamped record of every action across AMP · retained for 7 years'],\n      'gov-registration': ['Register agent on government portals', 'Sunrise Overseas Consultants · post-agreement compliance tasks'],\n      settings: ['Settings', 'Workspace, staff members and role-based access'],\n    }[r] || ['', ''];\n\n    const bar = (label, count, color, height) => ({ label, count, color, height: (height*100)+'%' });\n\n    const applications = [\n      { id: '2088', business: 'Highland Study Bridge', contact: 'Elena Martins', email: 'elena@highlandstudy.pt', phone: '+351 21 555 0290', country: 'Portugal', flag: '🇵🇹', date: '5 Aug 2026', age: 'signed 3h ago', status: 'Agreement Signed', ctaLabel: 'Start onboarding' },\n      { id: '2087', business: 'Sunrise Overseas Consultants', contact: 'Ananya Iyer', email: 'ananya@sunriseoverseas.in', phone: '+91 98333 71120', country: 'India', flag: '🇮🇳', date: '4 Aug 2026', age: '4 days ago', status: 'In Review' },\n      { id: '2086', business: 'Emerald Pathway Global', contact: 'Kwame Osei', email: 'kwame@emeraldpathway.com', phone: '+233 24 555 1010', country: 'Ghana', flag: '🇬🇭', date: '4 Aug 2026', age: '4 days ago', status: 'New' },\n      { id: '2085', business: 'Northstar Study Abroad', contact: 'Linh Pham', email: 'linh@northstar.vn', phone: '+84 24 3838 9900', country: 'Vietnam', flag: '🇻🇳', date: '3 Aug 2026', age: '5 days ago', status: 'Pending Documents' },\n      { id: '2084', business: 'Andes Education Partners', contact: 'Sofía Reyes', email: 'sofia@andes.co', phone: '+57 1 400 8899', country: 'Colombia', flag: '🇨🇴', date: '2 Aug 2026', age: '6 days ago', status: 'Pending Agent Response' },\n      { id: '2083', business: 'Silk Route Advisors', contact: 'Farhan Malik', email: 'farhan@silkroute.pk', phone: '+92 300 121 4433', country: 'Pakistan', flag: '🇵🇰', date: '1 Aug 2026', age: 'a week ago', status: 'In Review' },\n      { id: '2082', business: 'Cerulean Study Group', contact: 'Miguel Santos', email: 'miguel@cerulean.br', phone: '+55 11 3211 5567', country: 'Brazil', flag: '🇧🇷', date: '31 Jul 2026', age: '8 days ago', status: 'New' },\n      { id: '2081', business: 'Beacon Global Ed', contact: 'Wei Zhang', email: 'wei@beaconglobaled.cn', phone: '+86 21 5566 0011', country: 'China', flag: '🇨🇳', date: '29 Jul 2026', age: '10 days ago', status: 'Approved' },\n      { id: '2080', business: 'Meridian Overseas', contact: 'Rania Haddad', email: 'rania@meridianoverseas.ae', phone: '+971 4 555 2299', country: 'UAE', flag: '🇦🇪', date: '27 Jul 2026', age: '12 days ago', status: 'Rejected' },\n    ].map(a => {\n      const [bg, col] = this.status(a.status);\n      const isOnboarding = a.status === 'Agreement Signed';\n      return { ...a, statusBg: bg, statusColor: col,\n        ctaLabe
